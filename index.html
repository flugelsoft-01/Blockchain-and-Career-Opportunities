<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain & Career Opportunities - Student Guide</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="A comprehensive student-centric guidebook to breaking into Web3. Learn Solidity, smart contract security, build a portfolio, and explore career roles. By Kalyanjit Hatibaruah & Pratibha Das Hatibaruah.">
    <meta name="keywords" content="blockchain, web3, careers, computer science, solidity, rust, smart contracts, portfolio, kalyanjit hatibaruah, pratibha das hatibaruah">
    <meta name="author" content="Kalyanjit Hatibaruah & Pratibha Das Hatibaruah">
    
    <!-- OpenGraph Social Tags -->
    <meta property="og:title" content="Blockchain & Career Opportunities: A Student's Guide to Web3">
    <meta property="og:description" content="Master blockchain fundamentals, write Solidity smart contracts, build a strong portfolio, and land your first job in the Web3 space.">
    <meta property="og:image" content="/assets/book_front_cover.jpg">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Blockchain & Career Opportunities: A Student's Guide to Web3">
    <meta name="twitter:description" content="Master blockchain fundamentals, write Solidity smart contracts, build a strong portfolio, and land your first job in the Web3 space.">
    <meta name="twitter:image" content="/assets/book_front_cover.jpg">
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1BZS6E4XC8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1BZS6E4XC8');
    </script>
    
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Code Highlight Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <!-- Scroll Progress Indicator -->
    <div id="progressBar"></div>

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-cubes logo-icon"></i>
                    <span>Web3 Careers</span>
                </div>
                <button class="mobile-close" id="mobileCloseBtn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search chapters or topics...">
            </div>

            <nav class="sidebar-nav">
                <ul id="chaptersList">
                    <!-- Loaded dynamically via app.js -->
                </ul>
            </nav>
            
            <div class="sidebar-footer">
                <!-- User Authentication Panel -->
                <div id="userProfilePanel" class="user-panel" style="margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
                    <button class="signin-btn" id="signInBtn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background-color: var(--code-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; color: var(--text-primary); font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
                        <i class="fa-brands fa-google" style="color: #4285F4;"></i>
                        <span>Sign In with Google</span>
                    </button>
                    <div id="userInfoContainer" class="user-info-container" style="display: none; align-items: center; gap: 10px; padding: 4px 0;">
                        <img id="userAvatar" src="" alt="User Avatar" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-color);">
                        <div class="user-details" style="display: flex; flex-direction: column; text-align: left;">
                            <span id="userName" style="font-size: 12px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px;">Guest</span>
                            <button id="signOutBtn" style="background: none; border: none; color: #ef4444; font-size: 11px; text-align: left; cursor: pointer; padding: 0; width: fit-content; font-weight: 600;">Sign Out</button>
                        </div>
                    </div>
                </div>

                <button class="pdf-btn" id="downloadPdfBtn" aria-label="Download Book as PDF">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>Download PDF</span>
                </button>
                <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Dark/Light Mode">
                    <i class="fa-solid fa-moon moon-icon"></i>
                    <i class="fa-solid fa-sun sun-icon"></i>
                    <span id="themeToggleText">Light Mode</span>
                </button>
            </div>
        </aside>

        <!-- Main Reader Viewport -->
        <main class="main-content">
            <header class="top-nav">
                <button class="mobile-toggle" id="mobileToggleBtn" aria-label="Toggle Navigation Sidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="chapter-meta">
                    <span class="category-tag">BOOK READER</span>
                    <h2 id="topNavChapterTitle">Loading Chapter...</h2>
                </div>
            </header>

            <!-- Scrollable Content Container -->
            <article class="reader-container" id="readerContainer">
                <div class="sentinel-top"></div>
                <div class="book-content" id="bookContent">
                    <!-- Markdown Rendered Here -->
                </div>
                <div class="sentinel-bottom"></div>
            </article>
        </main>
    </div>
    
    <!-- Print Container for Full PDF Generation -->
    <div id="printBookWrapper" class="print-only"></div>

    <!-- Markdown Parser CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <!-- Code Syntax Highlighter CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <!-- Custom Application Logic -->
    <script type="module" src="/app.js"></script>
</body>
</html>
